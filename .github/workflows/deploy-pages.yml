name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build for GitHub Pages
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live game and assets
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for path in '' 'models/pebble.glb' 'ui/icons/pebble.svg' 'audio/sfx/pebble-hello.wav'; do
            curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "${PAGES_URL}${path}" --output /dev/null
          done
